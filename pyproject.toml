[project]
name = "domino-rl"
version = "0.1.0"
description = "Teach an AI to play Cuban double-9 domino with reinforcement learning"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "gymnasium==1.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
train = [
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",   # MaskablePPO
    "torch==2.14.0+cpu",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
domino-evaluate = "domino_rl.evaluate:main"
domino-train = "domino_rl.train:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
